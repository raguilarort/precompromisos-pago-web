<nav class="navbar navbar-dark shadow-sm fixed-top py-0 app-navbar">
  <div class="container-fluid ps-0 pe-3 pe-lg-4 d-flex align-items-center justify-content-between h-100 position-relative">

    <!-- 1. IZQUIERDA: Botón alineado (72px) + Logo y Marca (Desktop) -->
    <div class="d-flex align-items-center h-100">

      <!-- Contenedor de 72px exactos (alineado con el sidebar contraído) -->
      <div class="d-flex justify-content-center align-items-center flex-shrink-0" style="width: 72px;">
        <!-- Botón Hamburguesa (Solo Móvil) -->
        <button class="btn border-0 shadow-none d-lg-none p-1 btn-sidebar-toggle"
                type="button"
                (click)="layoutService.toggleSidebarMovil()"
                aria-label="Alternar navegación móvil">
          <i class="bi bi-list fs-4"></i>
        </button>

        <!-- Botón Contraer/Expandir (Solo Desktop) -->
        <button class="btn border-0 shadow-none d-none d-lg-block p-1 btn-sidebar-toggle"
                type="button"
                (click)="layoutService.toggleSidebarDesktop()"
                title="Expandir/Contraer menú lateral">
          <i class="bi fs-5"
             [class.bi-list]="!layoutService.sidebarExpandido()"
             [class.bi-text-indent-left]="layoutService.sidebarExpandido()"></i>
        </button>
      </div>

      <!-- Logo y Marca (Solo Desktop) -->
      <a class="navbar-brand d-none d-lg-flex align-items-center gap-2 text-white mb-0 py-0" routerLink="/home" style="cursor: pointer;">
        <img src="assets/images/logos/legislatura/actual/Logo_Legislatura_Blanco.png"
             alt="Logo Institucional"
             class="navbar-logo">
        <span class="fw-bold fs-6">Precompromisos App</span>
      </a>
    </div>

    <!-- 2. CENTRO -->
    <!-- Móvil: Logo centrado -->
    <a class="d-lg-none position-absolute top-50 start-50 translate-middle d-flex align-items-center"
       routerLink="/home"
       aria-label="Inicio">
      <img src="assets/images/logos/legislatura/actual/Logo_Legislatura_Blanco.png"
           alt="Logo Institucional"
           class="navbar-logo">
    </a>

    <!-- Desktop: Selector de Ejercicio -->
    <div class="d-none d-lg-block position-absolute top-50 start-50 translate-middle">
      <app-selector-ejercicio></app-selector-ejercicio>
    </div>

    <!-- 3. DERECHA: Dev Mode, Perfil y Salir -->
    <div class="d-flex align-items-center gap-2 gap-md-3">

      <!-- DEV MODE -->
      <div class="d-none d-xl-flex align-items-center border border-warning rounded px-2" title="Herramienta de Desarrollo">
        <span class="badge bg-warning text-dark me-2 shadow-sm" style="font-size: 0.65rem;">DEV</span>
        <select #rolSelect
                class="form-select form-select-sm border-0 bg-transparent text-white fw-medium focus-ring focus-ring-dark py-1"
                style="width: 150px; box-shadow: none;"
                (change)="cambiarRolDev(rolSelect.value)">
          @for (id of rolesIds; track id) {
            <option [value]="id"
                    [selected]="authService.usuarioAutenticado()?.rol === id"
                    class="text-dark">
              {{ RolSistema[id] }}
            </option>
          }
        </select>
      </div>

      <!-- Perfil de Usuario -->
      <div class="d-flex align-items-center gap-2">
        <div class="d-none d-md-block text-white small fw-medium text-end lh-sm">
          <span class="d-block">{{ authService.userName() }}</span>
          <span class="navbar-role-text">{{ nombreRolActual() }}</span>
        </div>

        @if (authService.userPhoto()) {
          <img [src]="authService.userPhoto()"
               alt="Perfil"
               class="rounded-circle border border-2 border-secondary flex-shrink-0"
               style="width: 36px; height: 36px; object-fit: cover;">
        } @else {
          <div class="rounded-circle text-white d-flex justify-content-center align-items-center fw-bold shadow-sm flex-shrink-0 navbar-avatar">
            {{ authService.userInitials() }}
          </div>
        }
      </div>

      <div class="vr text-secondary d-none d-md-block"></div>

      <!-- Botón Salir -->
      <button class="btn btn-outline-light btn-sm d-flex align-items-center gap-2"
              type="button"
              data-bs-toggle="modal"
              data-bs-target="#modalConfirmarCierre">
        <i class="bi bi-box-arrow-right"></i>
        <span class="d-none d-md-inline">Salir</span>
      </button>

    </div>

  </div>
</nav>
